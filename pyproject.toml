[project]
name = "dsic-3007-path-b"
version = "0.2.0"
description = "Focused OLMoE domain-conditioned causal audit"
requires-python = ">=3.12,<3.15"
dependencies = [
  "torch==2.12.1",
  "transformers==5.12.1",
  "numpy==2.4.6",
  "safetensors==0.8.0"
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]
figures = ["matplotlib==3.10.8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
